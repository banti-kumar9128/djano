
{% extends 'Layout.html' %}

{% block content %}

    <h1 class="text-primary text-center">User Login</h1>
    <p class="text-secondary text-center">Sign in to your account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <a href="{% url 'register' %}">Don't have an account? Register here.</a>

{% endblock %}
