{% extends 'Layout.html' %}

{% block content %}

    <h1 class="text-primary text-center">User Registration</h1>
    <p class="text-secondary text-center">Create a new account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <a href="{% url 'login' %}">Already have an account? Login here.</a>

{% endblock %}
