{% extends 'Layout.html' %}

{% block title %}Index Page{% endblock %}

{% block content %}

    <h1 class="text-primary text-center">Welcome to the Index Page!</h1>
    <p class="text-secondary text-center">This is a simple Django template.</p>

<h2>
    {%if form.instance.ok %}
    Edit message
    {%else%}Create New Message
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning">Submit</button>
        
    </form>
    <a href="{% url 'ham_list' %}">Back to List</a>

</h2>




{% endblock %}
