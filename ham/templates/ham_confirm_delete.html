{% extends 'Layout.html' %}

{% block title %}Index Page{% endblock %}

{% block content %}

    <h1 class="text-primary text-center">Welcome to the Index Page!</h1>
    <p class="text-secondary text-center">This is a simple Django template.</p>

<h2 class="text-center p-10">Are you sure you want to delete this message?</h2>
<form method="post" class="text-center mt-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'ham_list' %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
